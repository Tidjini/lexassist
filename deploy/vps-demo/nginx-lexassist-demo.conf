# Env de test/démo LexAssist sur le VPS — jamais le port 80 (réservé, le VPS
# héberge plusieurs projets). Desktop sur 8090, mobile-avocat sur 8091, les
# deux same-origin avec l'API (proxy /api vers daphne 127.0.0.1:8002), donc le
# routage tenant par Host fonctionne tel quel et il n'y a pas de CORS.
# Lien symbolique attendu : /etc/nginx/sites-enabled/lexassist-demo.conf

# NB : gzip_types etc. sont déjà définis au niveau http par la conf schoolavia
# si elle est en place ; sinon décommenter ici.
# gzip_types application/javascript application/json text/css image/svg+xml
#            application/wasm font/ttf application/vnd.ms-fontobject;
# gzip_comp_level 5;
# gzip_min_length 1024;
# gzip_vary on;
# gzip_proxied any;

# ── Desktop (frontend/build) ──────────────────────────────────────────────────
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    client_max_body_size 50M;

    root /srv/lexassist-demo/app/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # extraction IA de documents via Claude : lent
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /srv/lexassist-demo/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/lexassist-demo/app/media/;
    }
}

# ── Mobile avocat (mobile-avocat/dist) ────────────────────────────────────────
